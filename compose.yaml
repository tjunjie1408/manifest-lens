# Local-only defaults. The persistent database is a separate service.
name: averis-hackathon
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-averis}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-averis}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ['app']
    image: averis-shipping:local
    build: .
    command: ['node', 'scripts/migrate.mjs']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-averis}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    profiles: ['app']
    image: averis-shipping:local
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-averis}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-only-secret-at-least-32-chars}
      ORIGIN: http://127.0.0.1:3000
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

volumes:
  db-data:
