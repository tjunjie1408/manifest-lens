# Local-only defaults. The persistent database is a separate service.
name: averis-hackathon
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-averis}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-averis}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    profiles: ['app']
    image: averis-shipping:local
    build: .
    command: ['node', 'scripts/migrate.mjs']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-averis}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  app:
    profiles: ['app']
    image: averis-shipping:local
    build: .
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-averis}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-local-compose-only-secret-at-least-32-chars}
      ORIGIN: http://127.0.0.1:3000
      PORT: 3000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true

  inbox:
    profiles: ['evaluator']
    build:
      context: ./sdoc-hackathon-docker/server
    environment:
      DATA_DIR: /data
      GROUND_TRUTH: /secrets/ground_truth.json
      REVEAL_GT: '0'
    ports:
      - '127.0.0.1:8080:8000'
    volumes:
      - type: bind
        source: ./sdoc-hackathon-docker/data_v2/inbox
        target: /data/inbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./sdoc-hackathon-docker/data_v2/attachments
        target: /data/attachments
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./sdoc-hackathon-docker/data_v2/sample_submission.json
        target: /data/sample_submission.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./sdoc-hackathon-docker/data_v2/ground_truth.json
        target: /secrets/ground_truth.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  db-data:
